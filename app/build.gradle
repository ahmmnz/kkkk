apply plugin: 'com.android.application'

android {
    namespace 'com.googletv.kumanda'
    compileSdk 33

    defaultConfig {
        applicationId "com.googletv.kumanda"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
